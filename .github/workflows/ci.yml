name: CI

# 每次推送到 main、或有人提 PR 时：还原依赖 → 编译 → 跑全部测试 → 检查有漏洞的依赖包。
# 用 windows-latest：开发和生产的路径、编码习惯和 Windows 更接近，测试里有按文件路径读取的用例。
#
# ⚠ 2026-11-09 起默认「不再自动跑」：之前每次推送都跑，测试一红就发一封失败邮件，很吵。
#   质量把关已经挪到本地：推送前 tools/verify.ps1 + .githooks/pre-push 会自动跑同一套测试，
#   不通过直接拦下推送（见仓库根目录 README/更新日志）。需要时可以在
#   GitHub → Actions → CI → Run workflow 手动跑一次。
#   想恢复"每次推送自动跑"：把下面 push/pull_request 两段取消注释即可。
on:
  workflow_dispatch:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # 装 8.0（运行测试需要 .NET 8 运行时）和 10.0（和开发机一致的 SDK：编译、还原都用它；
      # global.json 只约定"不低于 8.0.100"，会自动选最高的那个）
      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: 显示 SDK 信息（排查环境差异用）
        run: dotnet --info

      - name: 还原依赖
        run: dotnet restore AttendanceSystem.slnx

      - name: 编译
        run: dotnet build AttendanceSystem.slnx -c Release --no-restore

      - name: 运行测试
        run: dotnet test AttendanceSystem.Tests/AttendanceSystem.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: '**/test-results.trx'

      - name: 检查有已知漏洞的依赖包（仅提示，不让构建失败）
        run: dotnet list AttendanceSystem.csproj package --vulnerable --include-transitive
        continue-on-error: true
